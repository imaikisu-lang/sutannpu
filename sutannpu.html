<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベントスタンプラリー</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #84fab0, #8fd3f4);
  font-family: "Helvetica Neue", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  width: 90%;
  max-width: 400px;
  border-radius: 20px;
  padding: 25px 20px 30px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.2);
  text-align: center;
}

.header {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}

h1 {
  margin: 5px 0 15px;
}

.stamps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 20px 0;
}

.stamp {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px dashed #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  color: #ccc;
}

.stamp.active {
  border: none;
  background: #ff7675;
  color: white;
  font-weight: bold;
  animation: pop 0.3s ease;
}

@keyframes pop {
  0% { transform: scale(0.8); }
  100% { transform: scale(1); }
}

button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  background: #0984e3;
  color: white;
  cursor: pointer;
}

button:disabled {
  background: #ccc;
}

.message {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">〇〇イベント スタンプラリー</div>
  <h1>📍 スタンプを集めよう！</h1>
  <p>各スポットでスタンプをGET！</p>

  <div class="stamps" id="stamps">
    <div class="stamp">1</div>
    <div class="stamp">2</div>
    <div class="stamp">3</div>
    <div class="stamp">4</div>
    <div class="stamp">5</div>
    <div class="stamp">6</div>
  </div>

  <button id="stampBtn" onclick="addStamp()">スタンプを押す</button>

  <div id="message" class="message"></div>
</div>

<script>
let count = 0;
const stamps = document.querySelectorAll(".stamp");
const message = document.getElementById("message");
const btn = document.getElementById("stampBtn");

function addStamp() {
  if (count < stamps.length) {
    stamps[count].classList.add("active");
    stamps[count].textContent = "✔";
    count++;

    if (count === stamps.length) {
      message.textContent = "🎉 コンプリート！景品交換へ！";
      btn.disabled = true;
    }
  }
}
</script>

</body>
</html>
